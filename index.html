<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- viewport-fit=cover: edge-to-edge bajo notch/barras. user-scalable=no +
         maximum-scale=1: evita el zoom por gesto que delata que es una web. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Color de la barra de estado de Android para que combine con la app. -->
    <meta name="theme-color" content="#020412" />
    <title>Buzzy</title>
    <!-- Script that is injected at runtime by Docker startup script -->
    <script src="/env-config.js"></script>
      <style>
        @keyframes pulse-glow {
          0%, 100% {
            box-shadow: 0 0 20px #00ffff, 0 0 5px #fff;
            transform: scale(1.0);
          }
          50% {
            box-shadow: 0 0 35px #00ffff, 0 0 10px #fff;
            transform: scale(1.05);
          }
        }
        .pulsate {
          animation: pulse-glow 2.5s infinite ease-in-out;
        }
        @keyframes win-flash {
          0%, 100% {
            text-shadow: 0 0 15px #00ffff;
            transform: scale(1);
          }
          50% {
            text-shadow: 0 0 30px #39ff14, 0 0 15px #fff;
            transform: scale(1.1);
          }
        }
        .win-animation {
          animation: win-flash 0.8s ease-in-out;
        }
      </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
